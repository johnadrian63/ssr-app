<div class="text-sm text-white w-full relative z-10">
   <nav
      class="relative h-[70px] flex items-center justify-between px-6 md:px-16 lg:px-24 xl:px-32 py-4 bg-white text-gray-900 transition-all shadow"
   >
      <a [routerLink]="['/']" class="text-indigo-600 font-bold">SSR App</a>
      <ul class="hidden md:flex items-center space-x-8 md:pl-28">
         <li><a class="hover:text-gray-500/80 transition" [routerLink]="['/posts']">Posts</a></li>
         <li><a class="hover:text-gray-500/80 transition" [routerLink]="['/users']">Users</a></li>
         <li><a class="hover:text-gray-500/80 transition" [routerLink]="['/photos']">Photos</a></li>
      </ul>

      <button
         (click)="toggleMenu()"
         aria-label="menu-btn"
         type="button"
         class="menu-btn inline-block md:hidden active:scale-90 transition"
      >
         <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
            <path
               d="M3 7a1 1 0 1 0 0 2h24a1 1 0 1 0 0-2zm0 7a1 1 0 1 0 0 2h24a1 1 0 1 0 0-2zm0 7a1 1 0 1 0 0 2h24a1 1 0 1 0 0-2z"
            />
         </svg>
      </button>

      <div
         [class.hidden]="!toggle()"
         class="mobile-menu absolute top-[70px] left-0 w-full bg-white shadow-sm p-6 hidden md:hidden"
      >
         <ul class="flex flex-col space-y-4 text-lg">
            <li>
               <a class="hover:text-gray-500/80 transition" [routerLink]="['/posts']">Posts</a>
            </li>
            <li>
               <a class="hover:text-gray-500/80 transition" [routerLink]="['/users']">Users</a>
            </li>
            <li>
               <a class="hover:text-gray-500/80 transition" [routerLink]="['/photos']">Photos</a>
            </li>
         </ul>
      </div>
   </nav>
</div>
<router-outlet />
