<form class="max-w-sm mx-auto space-y-4">
   <div>
      <label for="visitors" class="block mb-2.5 text-sm font-medium text-heading">Title</label>
      <div
         class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-2.5 py-2 shadow-xs placeholder:text-body"
      >
         {{ post()?.title }}
      </div>
   </div>
   <div>
      <label for="visitors" class="block mb-2.5 text-sm font-medium text-heading">Body</label>
      <div
         class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-2.5 py-2 shadow-xs placeholder:text-body"
      >
         {{ post()?.body }}
      </div>
   </div>
</form>
