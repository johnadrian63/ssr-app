<div
   class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default"
>
   <table class="w-full text-sm text-left rtl:text-right text-body">
      <thead
         class="text-sm text-body bg-neutral-secondary-soft border-b rounded-base border-default"
      >
         <tr>
            <th scope="col" class="px-6 py-3 font-medium">Name</th>
            <th scope="col" class="px-6 py-3 font-medium">Username</th>
            <th scope="col" class="px-6 py-3 font-medium">Email</th>
            <th scope="col" class="px-6 py-3 font-medium">Address</th>
            <th scope="col" class="px-6 py-3 font-medium">Phone</th>
            <th scope="col" class="px-6 py-3 font-medium">Website</th>
         </tr>
      </thead>
      <tbody>
         @for (user of users(); track user.id) {
            <tr class="bg-neutral-primary border-b border-default">
               <td class="px-6 py-4">
                  <a [routerLink]="['/users', user.id]" class="text-blue-600 hover:underline">{{
                     user.name
                  }}</a>
               </td>
               <td class="px-6 py-4">
                  {{ user.username }}
               </td>
               <td class="px-6 py-4">
                  {{ user.email }}
               </td>
               <td class="px-6 py-4">
                  {{
                     `${user.address.suite} ${user.address.street} ${user.address.city}, ${user.address.zipcode}`
                  }}
               </td>
               <td class="px-6 py-4">
                  {{ user.phone }}
               </td>
               <td class="px-6 py-4">
                  <a
                     [href]="'//' + user.website"
                     target="_blank"
                     class="text-blue-500 hover:underline"
                     >{{ user.website }}</a
                  >
               </td>
            </tr>
         }
      </tbody>
   </table>
</div>
